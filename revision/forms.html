<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- form -> label and input  -->
    <!-- signup, login form , students registration, aaddhar  -->

    <fieldset>
      <legend>Student registration</legend>
      <form>
        <label for="full name">Full Name : </label>
        <input type="text" placeholder="enter your name..." required />

        <br />
        <br />
        <label for="email">Email :</label>
        <input type="email" placeholder="enter your email" required />

        <br />
        <br />

        <label for="password"> Password : </label>
        <input type="password" placeholder="enter you password.." required />

        <br />
        <br />
        <label for="contact">Contact No. :</label>
        <input type="tel" placeholder="enter your contact details..." required />

        <br />
        <br />

        <!-- radio button  -->
        <label for="gender">Gender : </label>
        Male <input type="radio" value="Male" name="gender" /> Female
        <input type="radio" value="Female" name="gender" /> Transgender<input
          type="radio"
          value="Trans"
          name="gender"
        />

        <br />
        <br />
        <!-- checkbox  -->
        <label for="language">Language</label>
        <input type="checkbox" value="HTML" name="Language1" />HTML
        <input type="checkbox" value="CSS" name="Language2" />CSS
        <input type="checkbox" value="JS" name="Language3" />Javascript

        <br />
        <br />

        <label for="Description">Details</label>
        <textarea required></textarea>

        <br />
        <br />
        <button type="reset">Reset</button>
        <input type="submit" value="Submit" />
      </form>
    </fieldset>

    <!-- types - image, hidden, date , date time.... --> 
  </body>
</html>
